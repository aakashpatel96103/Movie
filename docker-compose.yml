services:
  movie-service:
    build:
      context: ./movie-service
    ports:
      - "8001:8001"

  booking-service:
    build:
      context: ./booking-service
    ports:
      - "8002:8002"
    environment:
      MOVIE_SERVICE_URL: http://movie-service:8001
    depends_on:
      - movie-service
